[package]
name = "corbel"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-or-later"
description = "G-code post-processor with two transforms: BrickLayers, which interlocks perimeters between layers, and Z anti-aliasing, which smooths the staircase off shallow surfaces"
repository = "https://github.com/erkexzcx/corbel"
readme = "README.md"
keywords = ["3d-printing", "gcode", "slicer", "post-processing", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "2"

[dev-dependencies]
crc32fast = "1"
ruzstd = "0.9.0"

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "audit-extrusion"
path = ".github/skills/bricklayers/scripts/extrusion.rs"
test = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The suite is compute-bound — footprint walks, surface grids, a nozzle
# replayed over 25 real plates — so unoptimised it spends minutes in code the
# binary runs in seconds. Every assertion, overflow check and `debug_assert`
# is still on; only the code generation changes.
#
# The integration tests do not call the library: they run the compiled binary
# through `CARGO_BIN_EXE_corbel`, so the binary's profile is what the suite
# pays for. Measured on `walls-3`, one `--bricks` pass: **18.0 s** at
# `opt-level = 2` against **11.3 s** at 3, and `plates.rs` alone is 21 of those
# passes. The dependencies are not held lower than the crate any more either —
# they build once and are cached, so the split bought nothing to keep.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 3
